name: 🤖 Bienvenido Brainiac - Nuevo issue

on:
  # issues:
  #   types: [opened]

  ## remover esto cuando lo tengan listo para prod
  workflow_dispatch:

permissions:
  issues: write

jobs:
  responder-issue:
    name: Responder al issue con mensaje de Brainiac
    runs-on: ubuntu-latest

    steps:
      - name: Comentario de bienvenida
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const autor = context.payload.issue.user.login;
            const cuerpo = [
              `🧠 **Saludos, ${autor}.**`,
              '',
              'Tu issue ha sido registrado en mi banco de datos y **está siendo revisado por Brainiac**.',
              '',
              `- Issue: #${context.payload.issue.number}`,
              `- Título: ${context.payload.issue.title}`,
              '',
              '_Mi intelecto de nivel 12 procesará tu solicitud en breve._'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: cuerpo
            });

      - name: Notificar por correo a Brainiac
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Brainiac Bot <${{ secrets.MAIL_USERNAME }}>
          to: prueba+123@google.com
          subject: '🧠 Nuevo issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}'
          html_body: |
            <h2>🧠 Nuevo issue registrado en el banco de datos</h2>
            <ul>
              <li><strong>Repositorio:</strong> ${{ github.repository }}</li>
              <li><strong>Issue:</strong> #${{ github.event.issue.number }}</li>
              <li><strong>Título:</strong> ${{ github.event.issue.title }}</li>
              <li><strong>Autor:</strong> ${{ github.event.issue.user.login }}</li>
              <li><strong>Enlace:</strong> <a href="${{ github.event.issue.html_url }}">${{ github.event.issue.html_url }}</a></li>
            </ul>
            <hr>
            <p><em>Mi intelecto de nivel 12 procesará tu solicitud en breve.</em></p>
